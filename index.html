<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Женская Сила — Карты Дня</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0b14;
    --surface: #16121f;
    --gold: #c9a96e;
    --gold-light: #e8d5a8;
    --text: #e8e0d5;
    --text-muted: #8a7f90;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  .stars {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 12%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 68%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 55%, rgba(255,255,255,0.07) 0%, transparent 100%),
      radial-gradient(2px 2px at 33% 18%, rgba(201,169,110,0.18) 0%, transparent 100%),
      radial-gradient(2px 2px at 66% 82%, rgba(155,127,212,0.12) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }

  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.75;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(30px, 7vw, 46px);
    font-weight: 300;
    letter-spacing: 3px;
    color: var(--gold-light);
    line-height: 1.15;
  }

  .divider {
    width: 56px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .subtitle {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    line-height: 1.7;
    text-align: center;
    max-width: 320px;
  }

  .reveal-btn {
    background: transparent;
    border: 1px solid rgba(201,169,110,0.6);
    color: var(--gold-light);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 18px 52px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }

  .reveal-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,169,110,0.08), rgba(107,79,160,0.08));
    opacity: 0;
    transition: opacity 0.4s;
  }

  .reveal-btn:hover::before { opacity: 1; }
  .reveal-btn:hover { box-shadow: 0 0 32px rgba(201,169,110,0.12); border-color: var(--gold); }

  .cards-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .date-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .cards-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
  }

  .card-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .card-wrapper.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card-wrapper:nth-child(2) { transition-delay: 0.25s; }

  .card-badge {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.65;
  }

  .card-img-wrap {
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(201,169,110,0.18);
    box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    background: var(--surface);
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-info {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 8px;
  }

  .card-planet {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--gold-light);
    letter-spacing: 2px;
  }

  .card-desc {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.75;
  }

  footer {
    font-size: 10px;
    color: rgba(138,127,144,0.35);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .cards-row { grid-template-columns: 1fr; gap: 36px; }
    body { padding: 36px 16px 60px; }
  }
</style>
</head>
<body>
<div class="stars"></div>

<div class="container">

  <header>
    <span class="eyebrow">Сакральные практики · Женская Сила</span>
    <h1>Карты дня</h1>
    <div class="divider"></div>
    <p class="subtitle">Две энергии, которые зовут тебя сегодня — одну включить, другую отпустить</p>
  </header>

  <button class="reveal-btn" onclick="revealCards()">
    Открыть карты дня
  </button>

  <div class="cards-area" id="cardsArea" style="display:none">
    <span class="date-label" id="dateLabel"></span>
    <div class="cards-row">
      <div class="card-wrapper" id="card1">
        <span class="card-badge">включить сегодня</span>
        <div class="card-img-wrap">
          <img id="img1" src="" alt="">
        </div>
        <div class="card-info">
          <div class="card-planet" id="name1"></div>
          <div class="card-desc" id="desc1"></div>
        </div>
      </div>
      <div class="card-wrapper" id="card2">
        <span class="card-badge">наблюдать и отпускать</span>
        <div class="card-img-wrap">
          <img id="img2" src="" alt="">
        </div>
        <div class="card-info">
          <div class="card-planet" id="name2"></div>
          <div class="card-desc" id="desc2"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>Женская Сила · Альбина</footer>

</div>

<script>
const planets = [
  { key: 'luna',    name: 'Луна',     img: 'luna.png',     desc: 'Сегодня твоя сила в глубоком чувствовании и доверии своим образам. Позволь себе не объяснять — просто ощущать.' },
  { key: 'mars',    name: 'Марс',     img: 'mars.png',     desc: 'Сегодня день действия из силы, а не из страха. Сделай то, что давно откладывала — тело знает, оно готово.' },
  { key: 'mercury', name: 'Меркурий', img: 'mercury.png',  desc: 'Сегодня твои слова и мысли особенно сильны. Говори из себя, не из чужих сценариев — твой голос открывает двери.' },
  { key: 'jupiter', name: 'Юпитер',   img: 'jupiter.png',  desc: 'Сегодня позволь себе мыслить шире обычного. Доверяй процессу — пространство уже открывается тебе навстречу.' },
  { key: 'venus',   name: 'Венера',   img: 'venus.png',    desc: 'Сегодня не добывай любовь и внимание — просто будь. Позволь себе принимать, не сжимаясь от вины.' },
  { key: 'sun',     name: 'Солнце',   img: 'sun.png',      desc: 'Сегодня ты — источник, а не отражение. Не жди разрешения светить — просто займи своё место.' },
  { key: 'saturn',  name: 'Сатурн',   img: 'saturn.png',   desc: 'Сегодня построй одну маленькую опору для себя. Сдержи слово, данное себе — это и есть настоящая сила.' }
];

function getTodayKey() {
  const d = new Date();
  return `ws_cards_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
}

function getRandomPair() {
  // Check if already picked today
  const key = getTodayKey();
  const stored = localStorage.getItem(key);
  if (stored) {
    return JSON.parse(stored);
  }

  // Generate unique random seed per user per day
  // Use random + store it
  const shuffled = [...planets].sort(() => Math.random() - 0.5);
  const pair = [shuffled[0].key, shuffled[1].key];
  localStorage.setItem(key, JSON.stringify(pair));

  // Clean up old keys
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('ws_cards_') && k !== key) {
      localStorage.removeItem(k);
    }
  }

  return pair;
}

function revealCards() {
  const pair = getRandomPair();
  const p1 = planets.find(p => p.key === pair[0]);
  const p2 = planets.find(p => p.key === pair[1]);

  const now = new Date();
  document.getElementById('dateLabel').textContent =
    now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

  document.getElementById('img1').src = p1.img;
  document.getElementById('img1').alt = p1.name;
  document.getElementById('name1').textContent = p1.name;
  document.getElementById('desc1').textContent = p1.desc;

  document.getElementById('img2').src = p2.img;
  document.getElementById('img2').alt = p2.name;
  document.getElementById('name2').textContent = p2.name;
  document.getElementById('desc2').textContent = p2.desc;

  const area = document.getElementById('cardsArea');
  area.style.display = 'flex';

  setTimeout(() => {
    document.getElementById('card1').classList.add('visible');
    setTimeout(() => document.getElementById('card2').classList.add('visible'), 250);
  }, 50);

  setTimeout(() => area.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
}
</script>
</body>
</html>
